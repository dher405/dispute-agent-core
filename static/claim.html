<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorize Your Dispute Claim</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 max-w-lg mx-auto">
    <div class="bg-white rounded-xl shadow-md p-6 mt-6 border border-slate-100">
        <h1 class="text-2xl font-bold text-slate-900">Claim Resolution Portal</h1>
        <p class="text-sm text-slate-500 mt-1">Review your statutory recovery estimate and authorize automated recovery.</p>

        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 my-4">
            <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider">Estimated Recovery Amount</span>
            <div id="recovery-amount" class="text-3xl font-extrabold text-blue-900 mt-1">$0.00</div>
            <p class="text-xs text-blue-700 mt-1">Contingency Fee: 25% only upon payout. $0 upfront.</p>
        </div>

        <form id="claim-form" class="space-y-4">
            <input type="hidden" id="lead-id" name="lead_id">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase">Full Name</label>
                <input type="text" id="full-name" required class="w-full p-2.5 border border-slate-300 rounded-md mt-1 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase">Email Address</label>
                <input type="email" id="email" required class="w-full p-2.5 border border-slate-300 rounded-md mt-1 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase">Mobile Phone</label>
                <input type="tel" id="phone" required class="w-full p-2.5 border border-slate-300 rounded-md mt-1 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div class="pt-2">
                <label class="flex items-start text-xs text-slate-600">
                    <input type="checkbox" id="consent" required class="mt-0.5 mr-2 h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                    <span>I authorize this dispute agent to represent my claim under applicable statutory guidelines and agree to the standard 25% contingency fee deducted upon successful carrier recovery.</span>
                </label>
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition">Authorize Claim</button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const leadId = urlParams.get("lead_id") || "";
        document.getElementById("lead-id").value = leadId;

        if (leadId) {
            fetch(`/api/v1/leads/${leadId}`)
                .then(r => r.json())
                .then(data => {
                    if (data.estimated_recovery_amount) {
                        document.getElementById("recovery-amount").innerText = `$${parseFloat(data.estimated_recovery_amount).toFixed(2)}`;
                    }
                })
                .catch(err => console.error(err));
        }

        document.getElementById("claim-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById("submit-btn");
            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting Authorization...";

            const payload = {
                lead_id: document.getElementById("lead-id").value,
                full_name: document.getElementById("full-name").value,
                email: document.getElementById("email").value,
                phone: document.getElementById("phone").value,
                stripe_payment_method_id: "pm_card_mock",
                consent_given: document.getElementById("consent").checked
            };

            const response = await fetch("/api/v1/claim/opt-in", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                alert("Claim authorized! Your AI dispute agent is now filing your paperwork.");
                submitBtn.innerText = "Claim Authorized";
            } else {
                alert("Error submitting claim.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Authorize Claim";
            }
        });
    </script>
</body>
</html>
